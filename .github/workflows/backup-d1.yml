# Daily backup of the submissions/accounts database (D1 biocartoon-submissions, used by the Workers
# in biocartoon/worker) to the private R2 bucket biocartoon-backups, as d1/<name>-<UTC time>.sql.gz.
# A lifecycle rule on the bucket deletes each export after 30 days.
#
# Needs its own repository secret, CLOUDFLARE_BACKUP_TOKEN: a Cloudflare API token limited to this
# account with "D1: Edit" (the export API needs it) and "Workers R2 Storage: Edit", kept separate
# from the deploy token. It reuses CLOUDFLARE_ACCOUNT_ID. The export holds account emails, so it
# never goes into a workflow artifact or the log: on a public repo those are visible to anyone.
#
# Restore:  npx wrangler r2 object get biocartoon-backups/d1/<file> --remote --file b.sql.gz
#           gunzip b.sql.gz && npx wrangler d1 execute <a new or emptied database> --remote --file b.sql
name: backup-d1
on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-d1
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_BACKUP_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER: npx --yes wrangler@4.165.0
      DB: biocartoon-submissions
    steps:
      # Says which permission a broken token lacks (only success flags and error messages are printed).
      - name: Check the token
        run: |
          set -uo pipefail
          api=https://api.cloudflare.com/client/v4
          check() { curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/$2" | jq -c --arg c "$1" '{check: $c, success, errors: [.errors[]?.message]}'; }
          check "token valid" user/tokens/verify
          # The token's id (not secret): compare it with the id in the token's dashboard URL.
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/user/tokens/verify" | jq -c '{token_id: .result.id, status: .result.status}'
          check "account-owned token valid" "accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify"
          check "D1 (D1: Edit)" "accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database"
          check "R2 bucket (Workers R2 Storage: Edit)" "accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets/biocartoon-backups"
      - name: Export D1 and upload it to R2
        run: |
          set -euo pipefail
          file="$DB-$(date -u +%Y%m%dT%H%M%SZ).sql"
          $WRANGLER d1 export "$DB" --remote --output "$RUNNER_TEMP/$file"
          # An empty or truncated export would quietly replace good backups as old ones expire.
          rows=$(grep -c '^INSERT INTO' "$RUNNER_TEMP/$file" || true)
          [ "$rows" -gt 0 ] || { echo "::error::export has no rows"; exit 1; }
          gzip -9 "$RUNNER_TEMP/$file"
          $WRANGLER r2 object put "biocartoon-backups/d1/$file.gz" --file "$RUNNER_TEMP/$file.gz" --remote
          echo "backed up $rows rows to biocartoon-backups/d1/$file.gz ($(stat -c %s "$RUNNER_TEMP/$file.gz") bytes)"
          rm -f "$RUNNER_TEMP/$file.gz"
