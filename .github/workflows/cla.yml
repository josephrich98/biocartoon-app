# Asks every pull request author to sign CLA.md once, by commenting on the pull request.
# Signatures are stored in signatures/cla.json on the `cla-signatures` branch.
name: CLA
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/josephrich98/biocartoon-app/blob/main/CLA.md
          branch: cla-signatures
          allowlist: josephrich98,dependabot[bot],github-actions[bot]
