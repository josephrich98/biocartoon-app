name: Bug report
description: Something in the app or the website doesn't work.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Screenshots help.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Web app (app.biocartoon.com)
        - Desktop app (macOS)
        - Desktop app (Windows)
        - Desktop app (Linux)
        - Website (biocartoon.com)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Desktop app version, or browser and version for the web app.
