    <path d="M185 230C175 235 176 251 184 258C193 266 206 258 206 247C207 236 197 225 185 230Z" fill="#8760A6" stroke="#6F4C8A" stroke-width="2"/>
    <path d="M231 240C221 238 214 247 216 258C218 271 229 276 239 268C250 260 244 243 231 240Z" fill="#8760A6" stroke="#6F4C8A" stroke-width="2"/>
    <path d="M207 274C198 276 196 287 203 295C211 303 225 300 229 291C234 279 219 270 207 274Z" fill="#8760A6" stroke="#6F4C8A" stroke-width="2"/>
    <g fill="#AC83BE" opacity=".8"><circle cx="215" cy="221" r="2.4"/><circle cx="238" cy="226" r="2.4"/><circle cx="253" cy="244" r="2"/><circle cx="253" cy="273" r="2.4"/><circle cx="239" cy="292" r="2"/><circle cx="184" cy="285" r="2.6"/><circle cx="171" cy="268" r="2"/><circle cx="194" cy="310" r="1.6"/><circle cx="217" cy="306" r="2"/><circle cx="205" cy="266" r="2"/><circle cx="167" cy="252" r="1.8"/></g>
  </g>

