      <ellipse rx="32" ry="25" fill="url(#rbc-fill)" stroke="#A93E50" stroke-width="2.7"/>
      <ellipse rx="14" ry="9" fill="#AD4056" opacity=".36"/>

    </g>
    <g transform="translate(366 615) rotate(21)">
      <ellipse rx="25" ry="17" fill="url(#rbc-fill)" stroke="#A93E50" stroke-width="2.4"/>
      <ellipse rx="12" ry="6" fill="#AD4056" opacity=".4"/>

