    <g id="muscle-fiber-end" inkscape:label="Fiber cross section">
      <ellipse cx="452" cy="210" rx="9" ry="24" fill="#EBA1BC" stroke="#B56084" stroke-width="2"/>
      <g fill="#C56C93" opacity=".85">
        <ellipse cx="451" cy="195" rx="2.2" ry="3"/>
        <ellipse cx="448" cy="205" rx="2" ry="2.8"/>
        <ellipse cx="455" cy="204" rx="2" ry="2.8"/>
        <ellipse cx="448" cy="215" rx="2" ry="2.8"/>
        <ellipse cx="455" cy="215" rx="2" ry="2.8"/>
        <ellipse cx="451" cy="225" rx="2.2" ry="3"/>
      </g>
