    <circle cx="500" cy="299" r="4.5" fill="#457FA8"/>

  </g>

  <!-- Adipocyte: a single large lipid droplet with the nucleus pushed to the rim. -->
  <g id="adipocyte" inkscape:label="Adipocyte — large lipid droplet and peripheral nucleus" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="170" cy="422" r="59" fill="#8D664F" opacity=".12" transform="translate(0 5)"/>
    <circle cx="170" cy="422" r="59" fill="#EBD17A" stroke="#BA9E46" stroke-width="3"/>
    <path d="M216 414C219 439 204 466 178 471C148 477 125 458 122 433C118 405 134 376 164 374C191 371 213 389 216 414Z" fill="url(#fat-fill)" stroke="#D7BB65" stroke-width="2"/>

    <path d="M208 449C210 440 216 434 223 432C222 445 217 458 207 466C203 462 204 456 208 449Z" fill="#9C7B55" stroke="#846748" stroke-width="1.5"/>
  </g>

  <!-- Osteocyte: one continuous stellate cell with long canalicular processes. -->
  <g id="osteocyte" transform="translate(126 -117)" inkscape:label="Osteocyte — stellate bone cell" stroke-linecap="round" stroke-linejoin="round">
    <path d="M360 348L368 379Q373 387 382 380L407 359L394 389Q391 397 402 398L437 392L410 410Q403 415 410 423L435 445L403 435Q394 432 392 442L393 475L375 450Q370 443 362 451L341 473L348 441Q350 433 339 432L307 440L331 419Q338 413 329 405L303 386L338 394Q347 396 348 385Z" fill="#8D664F" opacity=".12" transform="translate(0 4)"/>
    <path d="M360 348L368 379Q373 387 382 380L407 359L394 389Q391 397 402 398L437 392L410 410Q403 415 410 423L435 445L403 435Q394 432 392 442L393 475L375 450Q370 443 362 451L341 473L348 441Q350 433 339 432L307 440L331 419Q338 413 329 405L303 386L338 394Q347 396 348 385Z" fill="url(#bone-fill)" stroke="#B67534" stroke-width="2.8"/>

    <ellipse cx="371" cy="415" rx="17" ry="20" transform="rotate(-17 371 415)" fill="#BE7A42" stroke="#9B5E2F" stroke-width="2"/>
    <ellipse cx="376" cy="418" rx="5" ry="6" fill="#8B542C"/>
    <g stroke="#B67534" stroke-width="2"><path d="M356 367L345 359M401 367L413 368M423 401L432 410M423 441L426 453M391 462L402 470M345 459L333 459M319 430L312 420M319 390L317 378"/></g>
  </g>

  <!-- Hepatocyte: softly rounded hexagonal outline, central nucleus, small organelles. -->
