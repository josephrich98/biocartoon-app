    <g fill="#3D9178" opacity=".7"><circle cx="245" cy="594" r="2"/><circle cx="239" cy="526" r="2.2"/><circle cx="270" cy="523" r="1.7"/><circle cx="293" cy="578" r="2"/><circle cx="239" cy="605" r="1.8"/></g>
  </g>

  <!-- Erythrocytes: shaded biconcave discs, deliberately without nuclei. -->
  <g id="red-blood-cells" inkscape:label="Red blood cells — biconcave discs" stroke-linecap="round">
    <g transform="translate(391 560) rotate(-23)">
      <ellipse cy="4" rx="35" ry="27" fill="#8D664F" opacity=".12"/>
      <ellipse rx="35" ry="27" fill="url(#rbc-fill)" stroke="#A93E50" stroke-width="2.7"/>
      <ellipse rx="16" ry="10" fill="#AD4056" opacity=".36"/>

    </g>
    <g transform="translate(440 601) rotate(-35)">
