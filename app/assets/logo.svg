  </defs>

  <!-- Palette: the thumb opening is an even-odd subpath, not a white ellipse. -->
  <g id="palette" inkscape:label="Palette and open thumb hole" stroke-linecap="round" stroke-linejoin="round">
    <use href="#palette-shadow-outline" transform="translate(0 11)" fill="#745236" opacity=".11"/>
    <use href="#palette-edge-outline" transform="translate(0 6)" fill="#BB8B59" stroke="#A97B4D" stroke-width="3.5"/>
    <use href="#palette-outline" fill="url(#wood)" stroke="#AC8053" stroke-width="3.5"/>

    <g id="wood-grain" stroke="#BC925F" stroke-width="2" opacity=".18">
      <path d="M278 285C316 268 354 262 392 266"/>
      <path d="M115 356C138 340 160 332 184 329"/>
      <path d="M235 454C255 459 275 461 294 459"/>
      <path d="M326 511C366 522 410 524 449 514"/>
      <path d="M192 623C205 631 222 637 240 641"/>
    </g>
  </g>

