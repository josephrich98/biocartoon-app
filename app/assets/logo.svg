<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="768" height="768" viewBox="0 0 768 768" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">BioCartoon — the cell palette</title>
  <desc id="desc">A warm tan artist's palette with a subtly B-shaped silhouette and an open thumb hole. Seven individually editable biological motifs replace paint: a multilobed immune cell, striated muscle fiber, branching neuron, adipocyte, hexagonal hepatocyte, spiky osteocyte, and red blood cells. All artwork consists of native vector shapes; the background and thumb hole are transparent.</desc>
  <defs>
    <linearGradient id="wood" x1="186" y1="175" x2="522" y2="655" gradientUnits="userSpaceOnUse"><stop stop-color="#F6DFB8"/><stop offset=".52" stop-color="#EAC994"/><stop offset="1" stop-color="#D9AE76"/></linearGradient>
    <linearGradient id="immune-fill" x1="173" y1="211" x2="255" y2="307" gradientUnits="userSpaceOnUse"><stop stop-color="#F2E7FA"/><stop offset="1" stop-color="#C7A7DF"/></linearGradient>
    <linearGradient id="muscle-fill" x1="367" y1="184" x2="367" y2="236" gradientUnits="userSpaceOnUse"><stop stop-color="#F0A5BE"/><stop offset=".52" stop-color="#E78FAF"/><stop offset="1" stop-color="#CF7197"/></linearGradient>
    <linearGradient id="neuron-fill" x1="477" y1="263" x2="521" y2="326" gradientUnits="userSpaceOnUse"><stop stop-color="#8AC9EC"/><stop offset="1" stop-color="#4E9CCD"/></linearGradient>
    <radialGradient id="fat-fill" cx=".33" cy=".27" r=".8"><stop stop-color="#FFFDF0"/><stop offset=".75" stop-color="#FFF1AF"/><stop offset="1" stop-color="#F0D677"/></radialGradient>
    <linearGradient id="liver-fill" x1="240" y1="506" x2="299" y2="614" gradientUnits="userSpaceOnUse"><stop stop-color="#A5DBC1"/><stop offset="1" stop-color="#59B394"/></linearGradient>
    <linearGradient id="bone-fill" x1="337" y1="380" x2="396" y2="446" gradientUnits="userSpaceOnUse"><stop stop-color="#F8BE77"/><stop offset="1" stop-color="#E99747"/></linearGradient>
    <radialGradient id="rbc-fill" cx=".46" cy=".42" r=".64"><stop stop-color="#C6515B"/><stop offset=".37" stop-color="#CF5D64"/><stop offset=".61" stop-color="#E47F80"/><stop offset=".83" stop-color="#D76570"/><stop offset="1" stop-color="#B94155"/></radialGradient>
    <path id="palette-outline" fill-rule="evenodd" d="M540 400C540 379 592 367 615 338C673 266 620 209 531 170C415 115 236 136 145 214C100 263 82 441 114 544C151 644 306 705 437 665C540 637 613 594 610 531C608 481 568 455 547 426C541 417 540 408 540 400ZM525 438C508 427 487 438 477 459C466 482 469 505 485 514C501 523 521 511 531 489C541 466 540 448 525 438Z"/>
