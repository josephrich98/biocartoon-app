<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found · BioCartoon</title>
  <link rel="icon" href="/logo.svg" type="image/svg+xml" />
  <style>
    :root { --bg: #f6f7f9; --text: #1c1d21; --dim: #5d6370; --accent: #2f80ed; }
    @media (prefers-color-scheme: dark) { :root { --bg: #1b1b1b; --text: #e8e8ea; --dim: #a0a0a8; } }
    html, body { margin: 0; }
    body {
      background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      text-align: center; padding: 16px; box-sizing: border-box;
    }
    img { width: 80px; height: 80px; }
    h1 { font-size: 28px; margin: 16px 0 6px; }
    p { color: var(--dim); margin: 0 0 6px; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div>
    <img src="/logo.svg" alt="BioCartoon logo" />
    <h1>Page not found</h1>
    <p>There's nothing at this address.</p>
    <p><a href="/">Go to the home page</a> or <a href="https://app.biocartoon.com/">open the editor</a>.</p>
  </div>
</body>
</html>
