    <path d="M249 502Q255 499 261 503L303 528Q309 531 309 538L308 583Q308 590 302 594L261 618Q255 622 249 618L209 594Q203 590 203 583L204 538Q204 532 210 528Z" fill="url(#liver-fill)" stroke="#418B74" stroke-width="3"/>
