    <circle cx="500" cy="299" r="4.5" fill="#457FA8"/>
    <path d="M486 291C488 286 493 284 497 285" stroke="#E2F3FC" stroke-width="2.5"/>
  </g>

  <!-- Adipocyte: a single large lipid droplet with the nucleus pushed to the rim. -->
  <g id="adipocyte" inkscape:label="Adipocyte — large lipid droplet and peripheral nucleus" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="170" cy="422" r="59" fill="#8D664F" opacity=".12" transform="translate(0 5)"/>
    <circle cx="170" cy="422" r="59" fill="#EBD17A" stroke="#BA9E46" stroke-width="3"/>
    <path d="M216 414C219 439 204 466 178 471C148 477 125 458 122 433C118 405 134 376 164 374C191 371 213 389 216 414Z" fill="url(#fat-fill)" stroke="#D7BB65" stroke-width="2"/>
    <path d="M133 411C136 394 150 384 165 383" stroke="#FFFFFF" stroke-width="4" opacity=".85"/>
    <path d="M208 449C210 440 216 434 223 432C222 445 217 458 207 466C203 462 204 456 208 449Z" fill="#9C7B55" stroke="#846748" stroke-width="1.5"/>
  </g>

  <!-- Osteocyte: one continuous stellate cell with long canalicular processes. -->
  <g id="osteocyte" transform="translate(126 -117)" inkscape:label="Osteocyte — stellate bone cell" stroke-linecap="round" stroke-linejoin="round">
