    <g stroke="#78B9DF" stroke-width="4.5"><path d="M484 278L469 259L461 235M471 260L447 253M500 274L507 250L523 236M507 251L502 230M518 288L544 277L559 257M543 278L568 284M519 310L543 323L559 343M543 324L565 318M488 317L472 336L449 342M474 334L470 351M477 294L453 290L439 276M453 290L438 302M502 321C500 345 512 350 508 370C505 388 488 389 488 405M489 400L478 409M489 400L498 409"/></g>
    <path d="M484 273C490 278 496 279 503 271C505 282 511 287 523 287C516 297 517 305 526 314C514 313 507 317 502 328C497 319 489 316 478 322C482 309 478 304 469 297C480 292 484 286 484 273Z" fill="url(#neuron-fill)" stroke="#397BA6" stroke-width="2.5"/>
