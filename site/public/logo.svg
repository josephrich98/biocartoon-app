  </g>

  <!-- Skeletal muscle: elongated fiber, longitudinal myofibrils and transverse striations. -->
  <g id="muscle-cell" inkscape:label="Muscle — striated fiber" transform="rotate(-9 367 211)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M304 186C330 179 395 179 426 185C440 190 447 204 442 219C439 231 427 239 414 239L308 238C294 236 287 224 289 209C289 198 294 190 304 186Z" fill="#8D664F" opacity=".12" transform="translate(0 4)"/>
