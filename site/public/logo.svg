    <use href="#palette-outline" transform="translate(0 11)" fill="#745236" opacity=".11"/>
    <use href="#palette-outline" transform="translate(0 6)" fill="#BB8B59" stroke="#A97B4D" stroke-width="3.5"/>
    <use href="#palette-outline" fill="url(#wood)" stroke="#AC8053" stroke-width="3.5"/>
    <path d="M124 295C168 190 344 134 496 172" stroke="#FFF4D9" stroke-width="5" opacity=".6"/>
    <path d="M124 536C161 632 304 679 419 651" stroke="#F9E1B5" stroke-width="3" opacity=".55"/>
    <path d="M475 497C470 484 474 463 483 449C495 431 513 426 526 435" stroke="#B78C59" stroke-width="5"/>
    <path d="M487 520C505 529 527 515 538 491" stroke="#FBE6C0" stroke-width="4" opacity=".8"/>
    <g id="wood-grain" stroke="#BC925F" stroke-width="2" opacity=".18">
