    <path d="M209 204C239 200 268 222 271 251C276 284 252 312 222 316C190 321 160 300 155 270C149 239 176 208 209 204Z" fill="url(#immune-fill)" stroke="#9272AB" stroke-width="3"/>
    <path d="M169 245C176 226 191 218 207 216" stroke="#FFF9FF" stroke-width="4" opacity=".8"/>
    <path d="M193 244C204 247 215 256 225 263C231 270 232 279 225 285" stroke="#795596" stroke-width="8"/>
